name: CI

# Ikemen Saturn is an ordinary LibSaturn consumer. Each job first obtains an
# *installed* LibSaturn package (a prefix produced by `cmake --install`; see
# .github/actions/libsaturn-package) and then builds this project against that
# prefix alone.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      oracle:
        description: Also run the full upstream Ikemen GO oracle (long)
        type: boolean
        default: false

env:
  # LibSaturn release tag or commit whose installed package this project builds
  # against. Bump together with LIBSATURN_MIN_VERSION in CMakeLists.txt.
  LIBSATURN_REF: main

jobs:
  build:
    name: Host tests and firmware disc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: libsaturn
        uses: ./.github/actions/libsaturn-package
        with:
          ref: ${{ env.LIBSATURN_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies (asset converters)
        run: python -m pip install -r requirements.txt

      - name: Fetch pinned upstream data
        run: python scripts/fetch_external.py

      - name: Host tests
        env:
          LIBSATURN_PREFIX: ${{ steps.libsaturn.outputs.prefix }}
        run: |
          cmake --preset host
          cmake --build --preset host
          ctest --preset host

      - name: Firmware and disc
        env:
          LIBSATURN_PREFIX: ${{ steps.libsaturn.outputs.prefix }}
        run: |
          cmake --preset saturn
          cmake --build --preset saturn
          test -f build/saturn/disc/ikemen_saturn.cue

      - uses: actions/upload-artifact@v4
        with:
          name: ikemen-saturn-disc
          path: |
            build/saturn/ikemen_saturn.app.bin
            build/saturn/disc/ikemen_saturn.cue
            build/saturn/disc/ikemen_saturn.bin

  oracle:
    name: Upstream oracle
    if: github.event_name == 'workflow_dispatch' && inputs.oracle
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - id: libsaturn
        uses: ./.github/actions/libsaturn-package
        with:
          ref: ${{ env.LIBSATURN_REF }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies (asset converters)
        run: python -m pip install -r requirements.txt
      - name: Upstream build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libxmp-dev libavcodec-dev libavformat-dev libswresample-dev libswscale-dev libavfilter-dev libgtk-3-dev libgl1-mesa-dev xvfb
      - run: python scripts/fetch_external.py
      - name: Oracle suite
        env:
          LIBSATURN_PREFIX: ${{ steps.libsaturn.outputs.prefix }}
          GOEXPERIMENT: arenas
        run: |
          cmake --preset host
          xvfb-run -a cmake --build build/host --target ikemen_oracle_suite


  timeout_oracle:
    name: Timeout oracle (temporary)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[timeout-oracle]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - id: libsaturn
        uses: ./.github/actions/libsaturn-package
        with:
          ref: ${{ env.LIBSATURN_REF }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Upstream build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libxmp-dev libavcodec-dev libavformat-dev libswresample-dev libswscale-dev libavfilter-dev libgtk-3-dev libgl1-mesa-dev xvfb
      - run: python scripts/fetch_external.py
      - name: Patch Ikemen video dependency for Ubuntu FFmpeg 6
        run: |
          cd .external/Ikemen-GO
          go mod download github.com/ikemen-engine/reisen
          REISEN_VERSION="$(go list -m -f '{{.Version}}' github.com/ikemen-engine/reisen)"
          REISEN_DIR="$(go env GOMODCACHE)/github.com/ikemen-engine/reisen@${REISEN_VERSION}"
          chmod u+w "${REISEN_DIR}" "${REISEN_DIR}/video.go"
          sed -i '/params\.color_space =/d; /params\.color_range =/d' "${REISEN_DIR}/video.go"
      - name: Timeout frame oracle
        env:
          LIBSATURN_PREFIX: ${{ steps.libsaturn.outputs.prefix }}
          GOEXPERIMENT: arenas
        run: |
          cmake --preset host
          cmake --build --preset host
          xvfb-run -a python tools/ikemen_oracle/suite.py --keep-going --trace-bin build/host/ikemen_oracle_trace kfm_timeout_180.json kfm_timeout_win_180.json

  kfm_gameplay_oracle:
    name: KFM gameplay oracle
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[kfm-gameplay-oracle]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - id: libsaturn
        uses: ./.github/actions/libsaturn-package
        with:
          ref: ${{ env.LIBSATURN_REF }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Upstream build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libxmp-dev libavcodec-dev libavformat-dev libswresample-dev libswscale-dev libavfilter-dev libgtk-3-dev libgl1-mesa-dev xvfb
      - run: python scripts/fetch_external.py
      - name: Patch Ikemen video dependency for Ubuntu FFmpeg 6
        run: |
          cd .external/Ikemen-GO
          go mod download github.com/ikemen-engine/reisen
          REISEN_VERSION="$(go list -m -f '{{.Version}}' github.com/ikemen-engine/reisen)"
          REISEN_DIR="$(go env GOMODCACHE)/github.com/ikemen-engine/reisen@${REISEN_VERSION}"
          chmod u+w "${REISEN_DIR}" "${REISEN_DIR}/video.go"
          sed -i '/params\.color_space =/d; /params\.color_range =/d' "${REISEN_DIR}/video.go"
      - name: Full KFM gameplay parity matrix
        env:
          LIBSATURN_PREFIX: ${{ steps.libsaturn.outputs.prefix }}
          GOEXPERIMENT: arenas
        run: |
          cmake --preset host
          cmake --build --preset host
          xvfb-run -a python tools/ikemen_oracle/suite.py --keep-going --trace-bin build/host/ikemen_oracle_trace

  ko_oracle:
    # Temporary targeted parity gate while full KO landing flow is closed.
    name: KO oracle (temporary)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ko-oracle]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - id: libsaturn
        uses: ./.github/actions/libsaturn-package
        with:
          ref: ${{ env.LIBSATURN_REF }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Upstream build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libxmp-dev libavcodec-dev libavformat-dev libswresample-dev libswscale-dev libavfilter-dev libgtk-3-dev libgl1-mesa-dev xvfb
      - run: python scripts/fetch_external.py
      - name: Patch Ikemen video dependency for Ubuntu FFmpeg 6
        run: |
          cd .external/Ikemen-GO
          go mod download github.com/ikemen-engine/reisen
          REISEN_VERSION="$(go list -m -f '{{.Version}}' github.com/ikemen-engine/reisen)"
          REISEN_DIR="$(go env GOMODCACHE)/github.com/ikemen-engine/reisen@${REISEN_VERSION}"
          chmod u+w "${REISEN_DIR}" "${REISEN_DIR}/video.go"
          sed -i '/params\.color_space =/d; /params\.color_range =/d' "${REISEN_DIR}/video.go"
      - name: KO frame oracle
        env:
          LIBSATURN_PREFIX: ${{ steps.libsaturn.outputs.prefix }}
          GOEXPERIMENT: arenas
        run: |
          cmake --preset host
          cmake --build --preset host
          set +e
          xvfb-run -a python tools/ikemen_oracle/suite.py --keep-going --trace-bin build/host/ikemen_oracle_trace kfm_ko_stand_x_200.json kfm_ko_upper_y_240.json
          status=$?
          for scenario in kfm_ko_stand_x_200 kfm_ko_upper_y_240; do
            if test -f "build/ikemen_oracle/suite/$scenario/ikemen.jsonl" && test -f "build/ikemen_oracle/suite/$scenario/libsaturn.jsonl"; then
              echo "== detailed diff: $scenario =="
              python tools/ikemen_oracle/diff.py \
                "build/ikemen_oracle/suite/$scenario/ikemen.jsonl" \
                "build/ikemen_oracle/suite/$scenario/libsaturn.jsonl" \
                --limit 20 --pos-eps 1.5 --vel-eps 0.35 || true
            fi
          done
          echo "== round-state gate windows =="
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("build/ikemen_oracle/suite")
          for scenario, lo, hi in (
              ("kfm_ko_stand_x_200", 180, 200),
              ("kfm_ko_upper_y_240", 188, 220),
          ):
              print("##", scenario)
              for name in ("ikemen", "libsaturn"):
                  rows = [json.loads(x) for x in (base / scenario / f"{name}.jsonl").read_text().splitlines()]
                  trans = next((i for i,r in enumerate(rows) if r.get("round_state") == 4), None)
                  print("--", name, "first-rs4", trans)
                  for i in range(lo, min(hi, len(rows))):
                      r = rows[i]
                      c0, c1 = r["chars"][0], r["chars"][1]
                      print(i, "rs", r.get("round_state"),
                            "p1", c0["state_no"], c0["state_time"], c0["state_type"], c0["move_type"], "ctrl", c0.get("ctrl"),
                            "p2", c1["state_no"], c1["state_time"], c1["state_type"], c1["move_type"], "ctrl", c1.get("ctrl"))
          PY
          echo "== KO landing windows =="
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("build/ikemen_oracle/suite")
          for scenario, lo, hi in (
              ("kfm_ko_stand_x_200", 210, 231),
              ("kfm_ko_upper_y_240", 252, 273),
          ):
              print("##", scenario)
              for name in ("ikemen", "libsaturn"):
                  print("--", name, "--")
                  rows = [json.loads(x) for x in (base / scenario / f"{name}.jsonl").read_text().splitlines()]
                  for i in range(lo, min(hi, len(rows))):
                      r = rows[i]
                      p1, p2 = r["chars"][0], r["chars"][1]
                      print(i, "rs", r.get("round_state"),
                            "p1", p1["state_no"], p1["state_time"], p1["anim"], p1["anim_time"],
                            "ctrl", p1.get("ctrl"), "targets", p1.get("targets"), "ht", p1.get("hitdef_targets"),
                            "p2", p2["state_no"], p2["state_time"], p2["anim"], p2["anim_time"],
                            "life", p2["life"], "jug", p2["juggle"], "mt", p2["move_type"])
          PY
          echo "== upper KO frames 96..108 =="
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/ikemen_oracle/suite/kfm_ko_upper_y_240")
          for name in ("ikemen", "libsaturn"):
              print("--", name, "--")
              rows = [json.loads(x) for x in (root / f"{name}.jsonl").read_text().splitlines()]
              for i in range(96, 109):
                  r = rows[i]
                  c0, c1 = r["chars"][0], r["chars"][1]
                  print(i, "rs", r.get("round_state"),
                        "p1", c0["state_no"], c0["state_time"], c0["anim"], c0["anim_elem"], c0["anim_time"],
                        "hp", c0["hit_pause"], "mc", c0["move_contact_time"], "ht", c0["hitdef_targets"],
                        "p2", c1["state_no"], c1["state_time"], c1["anim"], c1["anim_elem"], c1["anim_time"],
                        "life", c1["life"], "jug", c1["juggle"], "pos", c1["pos"][:2], "vel", c1["vel"][:2])
          PY
          exit $status
